services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DB:-mydb}
      MONGO_APP_DB: ${MONGO_APP_DB:-mydb}
      MONGO_APP_USER: ${MONGO_APP_USER:-appuser}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppass}
    ports:
      - "${MONGO_HOST_PORT:-27017}:${MONGO_CONTAINER_PORT:-27017}"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro

  api:
    build: .
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER:-appuser}:${MONGO_APP_PASSWORD:-apppass}@mongo:${MONGO_CONTAINER_PORT:-27017}/${MONGO_APP_DB:-mydb}?authSource=${MONGO_APP_DB:-mydb}
      MONGODB_DB: ${MONGO_APP_DB:-mydb}
      MONGODB_COLLECTION: ${MONGO_APP_COLLECTION:-records}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      CONTAINER_PORT: ${CONTAINER_PORT:-8000}
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"

  importer:
    profiles:
      - import
    build: .
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER:-appuser}:${MONGO_APP_PASSWORD:-apppass}@mongo:${MONGO_CONTAINER_PORT:-27017}/${MONGO_APP_DB:-mydb}?authSource=${MONGO_APP_DB:-mydb}
      MONGODB_DB: ${MONGO_APP_DB:-mydb}
      MONGODB_COLLECTION: ${MONGO_APP_COLLECTION:-records}
      PARQUET_FILE: ${PARQUET_FILE:-data/beacons_merged_latest.parquet}
    command: ["python", "scripts/import_parquet.py"]
    volumes:
      - ./data:/app/data:ro

volumes:
  mongo_data:
