services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DB:-mydb}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro

  api:
    build: .
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      mongodb_uri: mongodb://${MONGO_APP_USER:-appuser}:${MONGO_APP_PASSWORD:-apppass}@mongo:27017/${MONGO_APP_DB:-mydb}?authSource=${MONGO_APP_DB:-mydb}
      mongodb_db: ${MONGO_APP_DB:-mydb}
      mongodb_collection: ${MONGO_APP_COLLECTION:-records}
    ports:
      - "8000:8000"

  importer:
    profiles:
      - import
    build: .
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER:-appuser}:${MONGO_APP_PASSWORD:-apppass}@mongo:27017/${MONGO_APP_DB:-mydb}?authSource=${MONGO_APP_DB:-mydb}
      MONGODB_DB: ${MONGO_APP_DB:-mydb}
      MONGODB_COLLECTION: ${MONGO_APP_COLLECTION:-records}
    command: ["python", "scripts/import_parquet.py"]
    volumes:
      - ./data:/app/data:ro

volumes:
  mongo_data:
